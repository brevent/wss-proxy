# https://github.com/actions/starter-workflows/blob/master/ci/cmake-multi-platform.yml
name: Build and Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_OVERLAY_TRIPLETS: ${{github.workspace}}/.github/vcpkg/triplets

jobs:
  build:
    if: ${{ github.ref_type != 'tag' || github.event_name == 'release' }}
    # https://docs.github.com/actions/using-workflows/about-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # https://github.com/actions/runner-images
        os: [ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, macos-26, macos-15, windows-2025, windows-2022]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 10
        fetch-tags: true

    - name: Export GitHub Actions cache environment variables
      if: ${{ startsWith(matrix.os, 'windows') }}
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install libevent and openssl on ubuntu
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      timeout-minutes: 5
      run: |
        for _ in 1 2 3; do
          sudo timeout 60 apt-get update &&
            sudo timeout 60 apt-get install -y libevent-dev libssl-dev python3-socks && exit 0
          sleep 5
        done
        exit 1

    - name: Install libevent and openssl on macos
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: brew list libevent &>/dev/null && brew uses --installed libevent || brew install libevent

    - name: Configure CMake on ubuntu and macos
      if: ${{ startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos') }}
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Configure CMake on windows
      if: ${{ startsWith(matrix.os, 'windows') }}
      env:
        CFLAGS: /D_WIN32_WINNT=0x0601
      run: |
        copy .github\vcpkg\${{matrix.os}}.json vcpkg.json
        if ('${{matrix.os}}' -eq 'windows-2025') {
          $p = "$env:RUNNER_TEMP\ports"
          mkdir $p\openssl, $p\libevent | Out-Null
          git -C C:\vcpkg archive -o $env:RUNNER_TEMP\openssl.tar 737382595bac2a92c7f8f54f120b53d2637af521
          git -C C:\vcpkg archive -o $env:RUNNER_TEMP\libevent.tar 49a66da074def8806e42235e6c64af567987498f
          tar -xf $env:RUNNER_TEMP\openssl.tar -C $p\openssl
          tar -xf $env:RUNNER_TEMP\libevent.tar -C $p\libevent
          cp .github\vcpkg\*.patch $p\openssl
          (Get-Content $p\openssl\vcpkg.json) -replace '"version": "[^"]+"', '"version": "3.5.9"' | Set-Content $p\openssl\vcpkg.json
          (Get-Content $p\openssl\portfile.cmake) -replace 'SHA512 \w+', 'SHA512 ab29a6ed40dd8c74420b9bd19c5ac119b0f191aee72d555ba5a0601456155d39c809c77300d98c7e0bce607f32c1f7a83fc7f69f86b9909fe557bba3aa2e468f' -replace 'PATCHES', 'PATCHES quic-time.patch quic-conn-window.patch quic-txp.patch' | Set-Content $p\openssl\portfile.cmake
          (Get-Content $p\libevent\vcpkg.json) -replace '"version": "[^"]+"', '"version": "2.1.13"' | Set-Content $p\libevent\vcpkg.json
          (Get-Content $p\libevent\portfile.cmake) -replace 'release-2.1.12-stable', 'release-2.1.13-stable' -replace 'SHA512 \w+', 'SHA512 a881c10d4af91a9c8c010cf72bb00de35b9adeb935839b4b32b032705c27e953b4a7e194dbb134b7f20f85e49145a35d49dbd5a9bdf9b8b111c93c6333ad37e1' | Set-Content $p\libevent\portfile.cmake
          $env:VCPKG_OVERLAY_PORTS = $p
          "VERSION_NAME=$((git describe --tags --always) -replace '^v')" >> $env:GITHUB_ENV
        }
        cmake -B ${{github.workspace}}\build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=c:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=win64-static -T v143

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Prepare test on macos
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: brew install shadowsocks-rust caddy && /usr/bin/pip3 install PySocks

    - name: Prepare test on windows
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: |
        pip3 install PySocks
        Copy-Item build/${{env.BUILD_TYPE}}/wss-proxy*.exe build/ -Verbose
        if ('${{matrix.os}}' -eq 'windows-2025') {
          Compress-Archive build/wss-proxy-client.exe "build/wss-proxy-client-$env:VERSION_NAME-win-x64.zip"
        }

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} -V

    - name: Benchmark on ubuntu-26.04
      if: ${{ matrix.os == 'ubuntu-26.04' }}
      run: |
        testcase/build-openssl.sh
        cd build && bash ../testcase/run-bench.sh

    - name: Upload windows artifact
      if: ${{ matrix.os == 'windows-2025' }}
      uses: actions/upload-artifact@v7
      with:
        path: build/wss-proxy-client-*-win-x64.zip
        archive: false

    - name: Upload windows release asset
      if: ${{ matrix.os == 'windows-2025' && github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload ${{ github.ref_name }} "build/wss-proxy-client-$env:VERSION_NAME-win-x64.zip" --clobber

  android:
    if: ${{ github.ref_type == 'tag' || github.event_name == 'release' }}
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 10
        fetch-tags: true

    - name: Build android plugin
      env:
        VERSION_CODE: ${{ github.run_number }}
        KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
        export VERSION_NAME=$(git describe --tags --always | sed 's/^v//')
        android/build.sh

    - name: Upload android artifact
      uses: actions/upload-artifact@v7
      with:
        path: build-android/wss-proxy-client-*.apk
        archive: false

    - name: Upload android release asset
      if: ${{ github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${{ github.ref_name }} build-android/wss-proxy-client-*.apk --clobber

  macos:
    if: ${{ github.ref_type == 'tag' || github.event_name == 'release' }}
    runs-on: macos-15

    strategy:
      matrix:
        arch: [arm64, x86_64]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 10
        fetch-tags: true

    - name: Build macos binary
      run: |
        export VERSION_NAME=$(git describe --tags --always | sed 's/^v//')
        macos/build.sh ${{ matrix.arch }}

    - name: Upload macos artifact
      uses: actions/upload-artifact@v7
      with:
        path: build-macos/wss-proxy-client-*.tar.gz
        archive: false

    - name: Upload macos release asset
      if: ${{ github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${{ github.ref_name }} build-macos/wss-proxy-client-*.tar.gz --clobber
