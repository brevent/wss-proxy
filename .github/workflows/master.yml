# https://github.com/actions/starter-workflows/blob/master/ci/cmake-multi-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_OVERLAY_TRIPLETS: ${{github.workspace}}/.github/vcpkg/triplets

jobs:
  build:
    # https://docs.github.com/actions/using-workflows/about-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # https://github.com/actions/runner-images
        os: [ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, macos-26, macos-15, windows-2025, windows-2022]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 10
        fetch-tags: true

    - name: Export GitHub Actions cache environment variables
      if: ${{ startsWith(matrix.os, 'windows') }}
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install libevent and openssl on ubuntu
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: sudo apt-get update && sudo apt-get install -y libevent-dev libssl-dev

    - name: Install libevent and openssl on macos
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: brew list libevent &>/dev/null && brew uses --installed libevent || brew install libevent

    - name: Configure CMake on ubuntu and macos
      if: ${{ startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos') }}
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Configure CMake on windows
      if: ${{ startsWith(matrix.os, 'windows') }}
      env:
        CFLAGS: /D_WIN32_WINNT=0x0601
      run: |
        copy .github\vcpkg\${{matrix.os}}.json vcpkg.json
        if ('${{matrix.os}}' -eq 'windows-2025') {
          vcpkg x-update-baseline --quiet
          $o = "$env:RUNNER_TEMP\openssl"
          cp -r C:\vcpkg\ports\openssl $o
          cp .github\vcpkg\*.patch $o
          (Get-Content $o\portfile.cmake) -replace 'PATCHES', 'PATCHES quic-time.patch quic-conn-window.patch' | Set-Content $o\portfile.cmake
          $env:VCPKG_OVERLAY_PORTS = $o
        }
        cmake -B ${{github.workspace}}\build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=c:\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=win64-static -T v143

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Prepare test on ubuntu
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: sudo apt-get install -y python3-socks

    - name: Prepare test on macos
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: brew install shadowsocks-rust && /usr/bin/pip3 install PySocks

    - name: Prepare test on windows
      if: ${{ startsWith(matrix.os, 'windows') }}
      shell: bash
      run: |
        pip3 install PySocks
        cp -v build/${{env.BUILD_TYPE}}/wss-proxy*.exe build/

    - name: Test
      env:
        SECRET_REMOTE_IP: ${{ secrets.SECRET_REMOTE_IP }}
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} -V

    - name: Upload windows artifact
      if: ${{ matrix.os == 'windows-2025' }}
      uses: actions/upload-artifact@v7
      with:
        name: wss-proxy-client-win-x64
        path: |
          build/${{env.BUILD_TYPE}}/wss-proxy-client.exe

    - name: Upload windows release asset
      if: ${{ matrix.os == 'windows-2025' && github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $f = "wss-proxy-client-${{ github.ref_name }}-win-x64.zip"
        Compress-Archive build/${{env.BUILD_TYPE}}/wss-proxy-client.exe $f
        gh release upload ${{ github.ref_name }} $f --clobber

  android:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 10
        fetch-tags: true

    - name: Build android plugin
      env:
        VERSION_CODE: ${{ github.run_number }}
        KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
        export VERSION_NAME=$(git describe --tags --always | sed 's/^v//')
        android/build.sh

    - name: Upload android artifact
      uses: actions/upload-artifact@v7
      with:
        path: build-android/wss-proxy-*.apk
        archive: false

    - name: Upload android release asset
      if: ${{ github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${{ github.ref_name }} build-android/wss-proxy-*.apk --clobber
