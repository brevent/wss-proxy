# https://github.com/actions/starter-workflows/blob/master/ci/cmake-multi-platform.yml
name: Build and Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.ref_type != 'tag' || github.event_name == 'release' }}
    # https://docs.github.com/actions/using-workflows/about-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # https://github.com/actions/runner-images
        os: [ubuntu-26.04, ubuntu-22.04, macos-26, macos-15, windows-2025]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 10
        fetch-tags: true

    - name: Install libevent and openssl on ubuntu
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      timeout-minutes: 5
      run: |
        for _ in 1 2 3; do
          sudo timeout 60 apt-get update &&
            sudo timeout 60 apt-get install -y libevent-dev libssl-dev python3-socks && exit 0
          sleep 5
        done
        exit 1

    - name: Install libevent and openssl on macos
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: brew list libevent &>/dev/null && brew uses --installed libevent || brew install libevent

    - name: Configure and build on ubuntu and macos
      if: ${{ startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos') }}
      run: |
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release
        cmake --build ${{github.workspace}}/build

    - name: Install nasm and jom on windows
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: |
        Invoke-WebRequest -MaximumRetryCount 3 -RetryIntervalSec 5 -OutFile nasm-installer.exe `
          -Uri https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-installer-x64.exe
        Start-Process -FilePath .\nasm-installer.exe -ArgumentList /S -Wait
        "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
        Invoke-WebRequest -MaximumRetryCount 3 -RetryIntervalSec 5 -OutFile jom.zip `
          -Uri https://download.qt.io/official_releases/jom/jom_1_1_7.zip
        Expand-Archive -Path jom.zip -DestinationPath $env:RUNNER_TEMP\jom
        "$env:RUNNER_TEMP\jom" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Configure and build on windows
      if: ${{ startsWith(matrix.os, 'windows') }}
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44 || exit /b 1
        "C:\Program Files\Git\bin\bash.exe" windows/build.sh "%GITHUB_WORKSPACE%\build" || exit /b 1

    - name: Prepare test on macos
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: brew install shadowsocks-rust caddy && /usr/bin/pip3 install PySocks

    - name: Prepare test on windows
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: pip3 install PySocks

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -V

    - name: Prepare upload on windows
      if: ${{ matrix.os == 'windows-2025' }}
      run: |
        $version = (git describe --tags --always) -replace '^v'
        Compress-Archive build/wss-proxy-client.exe "build/wss-proxy-client-$version-win-x64.zip"

    - name: Upload windows artifact
      if: ${{ matrix.os == 'windows-2025' }}
      uses: actions/upload-artifact@v7
      with:
        path: build/wss-proxy-client-*-win-x64.zip
        archive: false

    - name: Upload windows release asset
      if: ${{ matrix.os == 'windows-2025' && github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = (git describe --tags --always) -replace '^v'
        gh release upload ${{ github.ref_name }} "build/wss-proxy-client-$version-win-x64.zip" --clobber

  android:
    if: ${{ github.ref_type == 'tag' || github.event_name == 'release' }}
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 10
        fetch-tags: true

    - name: Build android plugin
      env:
        VERSION_CODE: ${{ github.run_number }}
        KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
        export VERSION_NAME=$(git describe --tags --always | sed 's/^v//')
        android/build.sh

    - name: Upload android artifact
      uses: actions/upload-artifact@v7
      with:
        path: build-android/wss-proxy-client-*.apk
        archive: false

    - name: Upload android release asset
      if: ${{ github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${{ github.ref_name }} build-android/wss-proxy-client-*.apk --clobber

  macos:
    if: ${{ github.ref_type == 'tag' || github.event_name == 'release' }}
    runs-on: macos-15

    strategy:
      matrix:
        arch: [arm64, x86_64]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 10
        fetch-tags: true

    - name: Build macos binary
      run: |
        export VERSION_NAME=$(git describe --tags --always | sed 's/^v//')
        macos/build.sh ${{ matrix.arch }}

    - name: Upload macos artifact
      uses: actions/upload-artifact@v7
      with:
        path: build-macos/wss-proxy-client-*.tar.gz
        archive: false

    - name: Upload macos release asset
      if: ${{ github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload ${{ github.ref_name }} build-macos/wss-proxy-client-*.tar.gz --clobber
