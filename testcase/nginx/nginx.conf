daemon off;
master_process off;
error_log stderr;
pid nginx.pid;

events {
}

http {
    log_format wss '$time_iso8601 "$request" $status $request_length $bytes_sent $request_time '
                   '*$connection $remote_port#$connection_requests $http_x_sock_type';
    access_log access.log wss;
    include localhost.conf;
}
