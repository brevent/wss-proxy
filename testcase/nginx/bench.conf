daemon off;
master_process off;
error_log stderr;
pid nginx.pid;

events {
}

http {
    access_log off;
    include localhost.conf;

    server {
        listen 127.0.0.1:8443 ssl;
        ssl_certificate localhost.crt;
        ssl_certificate_key localhost.key;
        root bench;
        sendfile on;
    }
}
