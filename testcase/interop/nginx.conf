daemon off;
master_process off;
error_log /logs/nginx.log info;
pid /nginx.pid;

events {
}

http {
    access_log off;

    server {
        listen 443 quic;
        listen [::]:443 quic;
        keepalive_requests 10000;

        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/priv.key;

        root /www;

        include /extra.conf;
    }
}
